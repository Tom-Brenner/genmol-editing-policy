# Experiment V2. Do not overwrite the locked Phase 3 artifacts.
# Planning assumption: ChEMBL 37 can supply 40,000 eligible parents
# (30,000 / 5,000 / 5,000). Confirm core-disjoint packing on the GPU machine
# before generating labels. Do not open manifests_v2/test.jsonl until the
# candidate set and validation rule below are frozen.
chembl_release: 37
chembl_chemreps_url: "https://ftp.ebi.ac.uk/pub/databases/chembl/ChEMBLdb/releases/chembl_37/chembl_37_chemreps.txt.gz"
chembl_chemreps_sha256: "ea6181ce8dc7af41974e35b92e1febb0c9dcbe2c62f7ccc4a5d983ac19f696e7"

paths:
  chembl_raw: "data/raw/chembl_37_chemreps.txt.gz"
  parents_parquet: "data/processed/parents_v2.parquet"
  manifests_dir: "manifests_v2"
  artifacts_dir: "artifacts_v2"
  results_dir: "results_v2"
  genmol_checkpoint: "vendor/genmol/checkpoints/model.ckpt"
  genmol_sampling: "configs/genmol_sampling.yaml"

fingerprint:
  kind: morgan_bit_vector
  radius: 2
  n_bits: 2048
  use_chirality: false

parent_filters:
  min_heavy_atoms: 15
  max_heavy_atoms: 45
  min_qed: 0.30
  max_qed: 0.85
  # Freeze min/max only after scripts/audit_action_counts.py. Do not require
  # four actions merely to simplify batching.
  min_eligible_actions: 2
  max_eligible_actions: 4

constraints:
  min_tanimoto_to_parent: 0.50
  max_heavy_atom_delta_fraction: 0.3333333333333333
  exact_core_required: true

reward:
  primary_property: qed
  success_qed_delta: 0.05
  reward_qed_delta_cap: 0.10

rollouts:
  labels_per_action: 8
  test_per_selected_action: 16
  probe_parents: 100
  probe_completions_per_parent: 10

split:
  n_train: 30000
  n_validation: 5000
  n_test: 5000
  manifest_seed: 20261001

manifest:
  # Packing margin above the 40,000-parent split. Replace from the audit
  # before the production manifest scan if core-disjoint quotas fail.
  target_eligible_pool: 80000
  scan_all: false

label:
  target: "completion_success"
  schema_version: 2

model_selection:
  primary_metric: "validation_top1_success_rate"
  candidates: ["shallow_mlp", "lightgbm_regressor", "lightgbm_ranker", "gatv2"]

models:
  shallow_mlp:
    hidden_sizes: [64]
    dropout: 0.15
    weight_decay: 0.0001
  # Action-conditioned GATv2 (attention), not a GCN. scripts/train_gat.py.
  gatv2:
    hidden_dim: 64
    heads: 4
    n_layers: 3
    dropout: 0.15
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 64
    max_epochs: 200
    patience: 20

value_model:
  hidden_sizes: [64, 32]
  learning_rate: 0.001
  batch_size: 64
  max_epochs: 200
  patience: 20
  huber_delta: 1.0
  log_every_n_steps: 100
  loss_weight: "inverse_reward_variance"
  variance_eps: 1.0

throughput_gate:
  max_seconds_per_completion: 20.0
  min_valid_fraction: 0.25
  audit_sample_size: 50

budget:
  gpu_hour_cap: 180
  terminate_spend_usd: 185
